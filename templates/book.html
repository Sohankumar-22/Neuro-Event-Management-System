{% extends "layout.html" %}

{% block content %}
<style>
    .book-wrapper { max-width: 900px; margin: 0 auto; padding: 2rem; }
    .category-hero { height: 35vh; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.7) 100%), url("{{ url_for('static', filename='image/landing_hero.png') }}"); background-size: cover; background-position: center; margin-top: -120px; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; }
    
    .geo-selector { display: flex; gap: 20px; margin-bottom: 30px; justify-content: center; }
    .geo-btn { padding: 15px 40px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; border-radius: 50px; cursor: pointer; transition: 0.3s; font-weight: 700; letter-spacing: 1px; }
    .geo-btn.active { background: linear-gradient(135deg, #00eeff, #9333ea); color: black; border: none; box-shadow: 0 0 20px rgba(0,238,255,0.3); }

    .input-group { margin-bottom: 2rem; }
    .input-group label { display: block; color: var(--primary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.8rem; font-weight: 700; }
    .input-group select, .input-group input { width: 100%; padding: 1.2rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: white; font-family: inherit; font-size: 1rem; }
    .input-group select option { background: #000; color: white; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 9999; text-align: center; }
    .congrats-card { background: #0d1117; border: 1px solid var(--primary); padding: 60px; border-radius: 40px; max-width: 500px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>

<div class="category-hero">
    <div class="hero-text animate-fade-in"><h1 class="gradient-text" style="font-size: 3rem;">Global Reservation</h1></div>
</div>

<div class="book-wrapper">
    <div class="book-header animate-fade-in" style="text-align: center; margin-bottom: 3rem;">
        <p style="color:var(--text-dim);">Planning a Masterpiece for <strong style="color:white;">{{ title }}</strong></p>
    </div>

    <!-- REGION SELECTOR -->
    <div class="geo-selector animate-fade-in">
        <button class="geo-btn active" id="btnIndia" onclick="setRegion('india')">🇮🇳 INSIDE INDIA</button>
        <button class="geo-btn" id="btnGlobal" onclick="setRegion('global')">🌍 OUTSIDE INDIA</button>
    </div>

    <div class="glass-card animate-fade-in" style="padding: 4rem; border-radius: 40px;">
        <form id="bookingForm" method="POST" action="{{ url_for('book') }}">
            <input type="hidden" name="region" id="regionField" value="India">
            <input type="hidden" name="title" value="{{ title }}">
            <input type="hidden" name="capacity" value="{{ capacity }}">

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                <div class="input-group">
                    <label>Assigned Venue Node</label>
                    <select name="location" id="locationSelect" required>
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div class="input-group">
                    <label>Hotel Contact Number</label>
                    <input type="tel" name="hotel_contact" placeholder="+91 XXXX-XXXXXX" required title="Please provide the hotel contact for coordination">
                </div>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" name="customer_name" placeholder="Client Identity" required>
                </div>
                <div class="input-group">
                    <label>Preferred Date</label>
                    <input type="date" name="date_booked" required min="{{today}}">
                </div>
                <div class="input-group" style="grid-column: span 2;">
                    <label>Estimated Guests</label>
                    <input type="number" name="guests" placeholder="Expected Operational Units" required max="{{capacity}}">
                </div>
                
                <div style="grid-column: span 2;">
                    <input type="hidden" name="catering" value="Yes">
                    <input type="hidden" name="entertainment" value="Yes">
                    <button type="button" class="btn-premium btn-primary" style="width: 100%; font-size: 1.1rem; padding: 20px;" onclick="submitTactical()">CONFIRM GLOBAL RESERVATION</button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- CONGRATS MODAL -->
<div class="modal-overlay" id="congratsModal">
    <div class="congrats-card">
        <div style="font-size: 5rem; margin-bottom: 20px;">🎊</div>
        <h2 class="gradient-text" style="font-size: 2.5rem; margin-bottom: 10px;">CONGRATULATIONS!</h2>
        <p style="color: white; font-size: 1.1rem; line-height: 1.6;">Your <strong>{{ title }}</strong> has been commissioned successfully. Our logistics team will now secure your venue at the hotel.</p>
        <p style="color: var(--text-dim); margin-top: 20px;">Redirecting to your secure portfolio...</p>
    </div>
</div>

<script>
    const cities = {
        india: ["Mumbai, IN", "New Delhi, IN", "Bangalore, IN", "Goa, IN", "Udaipur, IN", "Jaipur, IN"],
        global: ["Dubai, UAE", "London, UK", "New York, USA", "Paris, FRA", "Singapore, SGP", "Tokyo, JPN"]
    };

    function setRegion(r) {
        document.getElementById('regionField').value = r === 'india' ? 'India' : 'International';
        document.getElementById('btnIndia').classList.toggle('active', r === 'india');
        document.getElementById('btnGlobal').classList.toggle('active', r === 'global');
        
        const sel = document.getElementById('locationSelect');
        sel.innerHTML = "";
        cities[r].forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            sel.appendChild(opt);
        });
    }

    function submitTactical() {
        const form = document.getElementById('bookingForm');
        if(!form.checkValidity()) {
            form.reportValidity();
            return;
        }
        
        // Show Congrats Message
        document.getElementById('congratsModal').style.display = 'flex';
        
        // Wait 3 seconds then submit
        setTimeout(() => {
            form.submit();
        }, 4000);
    }

    // Initialize with India
    setRegion('india');
</script>
{% endblock %}
