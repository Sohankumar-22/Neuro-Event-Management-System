{% extends "layout.html" %}
{% block content %}
<div style="max-width: 600px; margin: 10rem auto; text-align: center; padding: 2rem;">
    <div class="glass-card animate-fade-in" style="padding: 4rem; border-radius: 24px;">
        <div style="font-size: 5rem; margin-bottom: 2rem;">✅</div>
        <h1 class="gradient-text" style="font-size: 3rem; margin-bottom: 1rem;">RSVP Successful!</h1>
        <p style="color: var(--text-dim); font-size: 1.2rem; margin-bottom: 3rem;">We've added you to the guest list for the <b>{{ booking.title }}</b>. The host has been notified.</p>
        
        <div class="glass-card" style="padding: 1.5rem; border-color: var(--primary); display: inline-block;">
            <p style="font-size: 0.9rem; color: var(--text-dim);">SEE YOU ON</p>
            <h3 style="color: white; margin-top: 0.5rem;">{{ booking.date_booked }}</h3>
        </div>
        
        <div style="margin-top: 4rem;">
            <a href="{{ url_for('home') }}" class="btn-premium" style="padding: 1rem 3rem;">Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
